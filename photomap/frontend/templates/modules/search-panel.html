<!-- HTML template for the search icons: show/hide semantic map, search by image similarity, search by text -->
<!-- Search Panel -->
<div id="searchPanel">
  <div class="search-panel-title">Search</div>
  <div class="search-icons-row">
    <div class="search-icon-container bookmark-icon-container">
      <button id="bookmarkMenuBtn" title="Bookmarks">
        <span id="bookmarkMenuIcon">
          <svg
            width="32"
            height="32"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#fff"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
          </svg>
        </span>
      </button>
      <div class="button-label">Bookmarks</div>
    </div>

    <div class="search-icon-container">
      <button id="showUmapBtn" title="Show semantic map">
        <span id="showUmapIcon">
          <!-- lucide "map" (ISC): the folded paper map, matching the icon
               InvokeAI uses for the same feature in its image-map widget. -->
          <svg
            width="32"
            height="32"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#fff"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M14.106 5.553a2 2 0 0 0 1.788 0l3.659-1.83A1 1 0 0 1 21 4.619v12.764a1 1 0 0 1-.553.894l-4.553 2.277a2 2 0 0 1-1.788 0l-4.212-2.106a2 2 0 0 0-1.788 0l-3.659 1.83A1 1 0 0 1 3 19.381V6.618a1 1 0 0 1 .553-.894l4.553-2.277a2 2 0 0 1 1.788 0z"
            />
            <path d="M15 5.764v15" />
            <path d="M9 3.236v15" />
          </svg>
        </span>
      </button>
      <div class="button-label">By Map</div>
    </div>

    <div class="search-icon-container">
      <button id="imageSearchBtn" title="Search for similar images">
        <span id="imageSearchIcon">
          <svg
            width="32"
            height="32"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#fff"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
            <circle cx="8.5" cy="8.5" r="1.5" />
            <polyline points="21 15 16 10 5 21" />
          </svg>
        </span>
      </button>
      <div class="button-label">By Image</div>
    </div>

    <div class="search-icon-container">
      <button id="textSearchBtn" title="Search">
        <span id="textSearchIcon">
          <svg
            id="searchIcon"
            width="32"
            height="32"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#fff"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="11" cy="11" r="8" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
        </span>
      </button>
      <div class="button-label">By Text</div>
    </div>

    <div class="search-icon-container clear-search-container">
      <button id="clearSearchBtn" title="Clear Search" disabled>
        <svg
          width="32"
          height="32"
          viewBox="0 0 24 24"
          fill="none"
          stroke="#fff"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="4" y="4" width="16" height="16" rx="2" ry="2" />
          <line x1="8" y1="8" x2="16" y2="16" />
          <line x1="16" y1="8" x2="8" y2="16" />
        </svg>
      </button>
      <div class="button-label">Clear</div>
    </div>

    <div class="search-icon-container">
      <button id="aboutBtn" title="About">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="#fff">
          <circle
            cx="12"
            cy="12"
            r="10"
            stroke="#fff"
            stroke-width="2"
            fill="none"
          />
          <text
            x="12"
            y="12"
            text-anchor="middle"
            font-size="16"
            fill="#fff"
            font-family="Arial"
            dy=".3em"
          >
            ?
          </text>
        </svg>
      </button>
      <div class="button-label">About</div>
    </div>
  </div>
</div>
