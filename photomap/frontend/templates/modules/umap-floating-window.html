<!-- UMAP Floating Window -->
<!-- This is referred to as the "semantic map" in the UI -->

<div id="umapFloatingWindow">
  <!-- Titlebar -->
  <div id="umapTitlebar">
    <div class="umap-titlebar-left">
      <button id="umapReindexBtn" class="icon-btn" title="Update this album's index" aria-label="Update this album's index">
        <!-- Two circling arrows, pale grey on the dark titlebar to match the
             neighbouring resize icons; sized to the pulldown's text height. -->
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="#d0d0d0"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <polyline points="23 4 23 10 17 10" />
          <polyline points="1 20 1 14 7 14" />
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10" />
          <path d="M20.49 15a9 9 0 0 1-14.85 3.36L1 14" />
        </svg>
      </button>
      <!-- Swapped in for the button while an index update runs. The ring
           fills with progress_percentage; the title carries the status text
           so hovering shows what the indexer is doing. -->
      <span id="umapReindexProgress" class="umap-reindex-progress" style="display: none" role="progressbar">
        <svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true">
          <circle class="umap-reindex-track" cx="10" cy="10" r="8" />
          <circle id="umapReindexRing" class="umap-reindex-ring" cx="10" cy="10" r="8" />
        </svg>
      </span>
      <select id="semanticMapAlbumSelect" class="album-select" title="Switch album" aria-label="Switch album"></select>
      <span class="album-select-caret" aria-hidden="true">&#9662;</span>
    </div>
    <div style="display: flex; align-items: center; gap: 3px">
      <!-- Resizing icons -->
      <button id="umapResizeFullscreen" title="Fullscreen" class="icon-btn">
        <svg width="24" height="24" viewBox="0 0 24 24">
          <!-- Central point -->
          <circle cx="12" cy="12" r="1.5" fill="#FFD600" />
          <!-- Bright square outline -->
          <rect
            x="4"
            y="4"
            width="16"
            height="16"
            rx="4"
            fill="none"
            stroke="#D0D0D0"
            stroke-width="1"
          />
          <!-- Arrows to corners -->
          <g stroke="#FFD600" stroke-width="2.5" fill="#FFD600">
            <!-- Top-left arrow -->
            <line x1="12" y1="12" x2="4" y2="4" />
            <polygon points="4,4 7,4 4,7" />
            <!-- Top-right arrow -->
            <line x1="12" y1="12" x2="20" y2="4" />
            <polygon points="20,4 17,4 20,7" />
            <!-- Bottom-left arrow -->
            <line x1="12" y1="12" x2="4" y2="20" />
            <polygon points="4,20 7,20 4,17" />
            <!-- Bottom-right arrow -->
            <line x1="12" y1="12" x2="20" y2="20" />
            <polygon points="20,20 17,20 20,17" />
          </g>
        </svg>
      </button>

      <button id="umapResizeBig" title="Large" class="icon-btn">
        <svg width="28" height="28" viewBox="0 0 28 28">
          <rect
            x="4"
            y="4"
            width="20"
            height="20"
            rx="4"
            fill="#fff"
            opacity="0.8"
          />
        </svg>
      </button>
      <button id="umapResizeMedium" title="Medium" class="icon-btn">
        <svg width="20" height="20" viewBox="0 0 20 20">
          <rect
            x="3"
            y="3"
            width="14"
            height="14"
            rx="3"
            fill="#fff"
            opacity="0.8"
          />
        </svg>
      </button>
      <button id="umapResizeSmall" title="Small" class="icon-btn">
        <svg width="14" height="14" viewBox="0 0 14 14">
          <rect
            x="2"
            y="2"
            width="10"
            height="10"
            rx="2"
            fill="#fff"
            opacity="0.8"
          />
        </svg>
      </button>
      <button id="umapResizeShaded" title="Shaded" class="icon-btn">
        <svg width="18" height="10" viewBox="0 0 18 10">
          <rect
            x="2"
            y="2"
            width="14"
            height="6"
            rx="2"
            fill="#fff"
            opacity="0.8"
          />
        </svg>
      </button>
      <button id="umapToggleControlsBtn" title="Show controls" class="icon-btn">
        <svg width="16" height="14" viewBox="0 0 16 14">
          <rect x="2" y="1.5" width="12" height="2" rx="1" fill="#fff" opacity="0.8"/>
          <rect x="2" y="6"   width="12" height="2" rx="1" fill="#fff" opacity="0.8"/>
          <rect x="2" y="10.5" width="12" height="2" rx="1" fill="#fff" opacity="0.8"/>
        </svg>
      </button>
      <button
        id="umapCloseBtn"
        style="
          background: none;
          border: none;
          color: #fff;
          font-size: 1.5em;
          cursor: pointer;
          margin-left: 8px;
        "
        title="Close"
      >
        &times;
      </button>
    </div>
  </div>

  <!-- All other content hidden until plot is ready -->
  <div id="umapContent" style="display: none">
    <!-- Spinner (always visible during loading) -->
    <div
      id="umapSpinner"
      style="
        display: none;
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        z-index: 10000;
        pointer-events: none;
      "
    >
      <div class="umap-spinner"></div>
    </div>

    <!-- Plotly Plot -->
    <div id="umapPlot"></div>

    <div id="umapControls">
      <!-- Two balanced columns: the first holds the two map-shaping controls
           (strength, landmarks) over the click behaviour; the second holds
           the four on/off preferences. Each cell is a fixed grid slot, so a
           control that is hidden until the plot is ready (the strength
           spinner) never lets its neighbours slide into its place. -->
      <div id="umapControlsGrid">
        <div class="umap-control-cell">
          <div id="umapEpsContainer" style="display: none; padding: 0px">
            <button id="umapClusterInfoBtn" type="button" class="umap-info-btn" title="Cluster information">i</button>
            <label for="umapEpsSpinner">Cluster Strength</label>
            <!-- max was 1.0, but a derived strength for a small album can
                 legitimately exceed it: UMAP spreads few points over a wide
                 area, so the distances that separate clusters are larger.
                 A lower ceiling would display a number the map is not
                 actually clustering with. -->
            <input
              type="number"
              id="umapEpsSpinner"
              min="0.01"
              max="3.0"
              step="0.01"
              value="0.1"
              autocomplete="off"
              style="width: 60px"
            />
            <!-- Shown while the strength is derived rather than chosen;
                 umap.js clears it as soon as the user edits the spinner. -->
            <span id="umapEpsAutoBadge" class="umap-eps-auto-badge" hidden>auto</span>
            <!-- Shown when the server clustered at less than the strength
                 asked for, because the album is too large to afford it. -->
            <span id="umapEpsEffective" class="umap-eps-effective" hidden></span>
          </div>
        </div>
        <label class="umap-control-cell">
          <input type="checkbox" id="umapShowHoverThumbnails" checked />
          Show hover thumbnails
        </label>

        <div class="umap-control-cell">
          <label for="umapLandmarkStyle">Landmarks</label>
          <select id="umapLandmarkStyle" autocomplete="off">
            <option value="none">None</option>
            <option value="thumbnails">Thumbnails</option>
            <option value="tiles">Tiles</option>
            <option value="text">Text labels</option>
          </select>
        </div>
        <label class="umap-control-cell">
          <input type="checkbox" id="umapHighlightSelection" />
          <span>Highlight selection (<a id="umapClearSelectionLink" href="#">clear</a>)</span>
        </label>

        <div id="umapClickBehaviorContainer" class="umap-control-cell">
          <span>Click selects</span>
          <label>
            <input
              type="radio"
              name="umapClickBehavior"
              id="umapClickSelectsClusterRadio"
              value="cluster"
              checked
            />
            cluster
          </label>
          <label>
            <input type="radio" name="umapClickBehavior" id="umapClickSelectsImageRadio" value="image" />
            image
          </label>
        </div>
        <label id="umapExitFullscreenLabel" class="umap-control-cell">
          <input type="checkbox" id="umapExitFullscreenOnSelection" checked />
          Exit fullscreen on selection
        </label>
      </div>
    </div>
  </div>
</div>

<!-- Cluster Info Modal -->
<div id="umapClusterInfoModal" class="modal-overlay">
  <div class="modal-content" style="max-width: 400px; position: relative;">
    <button id="umapClusterInfoClose" class="modal-close" title="Close">✖</button>
    <p style="margin: 0 0 14px 0; color: #ccc; line-height: 1.5; font-size: 0.9em;">
      Higher cluster strength values increase the size and reduce the number of clusters.
    </p>
    <table style="width: 100%; border-collapse: collapse; font-size: 0.9em;">
      <tr>
        <td style="color: #888; padding: 4px 0;">Current cluster strength</td>
        <td id="umapInfoEps" style="text-align: right; color: #faea0e; font-weight: bold;"></td>
      </tr>
      <tr>
        <td style="color: #888; padding: 4px 0;">Cluster count</td>
        <td id="umapInfoClusterCount" style="text-align: right; color: #fff;"></td>
      </tr>
      <tr>
        <td style="color: #888; padding: 4px 0;">Largest cluster</td>
        <td id="umapInfoLargest" style="text-align: right; color: #fff;"></td>
      </tr>
      <tr>
        <td style="color: #888; padding: 4px 0;">Smallest cluster</td>
        <td id="umapInfoSmallest" style="text-align: right; color: #fff;"></td>
      </tr>
      <tr>
        <td style="color: #888; padding: 4px 0;">Unclustered images</td>
        <td id="umapInfoUnclustered" style="text-align: right; color: #fff;"></td>
      </tr>
      <tr>
        <td style="color: #888; padding: 4px 0; border-top: 1px solid #444;">Total images</td>
        <td id="umapInfoTotal" style="text-align: right; color: #fff; border-top: 1px solid #444;"></td>
      </tr>
    </table>
  </div>
</div>
