<!-- Drawer Container for image metadata drawer -->
<div id="bannerDrawerContainer" class="banner-drawer-container">
  <!-- Overlay Drawer Toggle -->
  <div id="overlayDrawer" class="overlay-drawer">
    <div class="drawer-handle">
      <svg class="drawer-arrow" viewBox="0 0 18 18">
        <path d="M7 14l5-5 5 5z" fill="currentColor"></path>
      </svg>
    </div>
  </div>

  <!-- File Info Banner -->
  <div id="filenameBanner" class="filename-banner">
    <!-- Draggable Titlebar -->
    <div id="filenameTitlebar" class="filename-titlebar">
      <div class="filename-titles">
        <span id="filenameText"></span>
        <!-- Full path (issue #432): selectable, and not a drag handle -->
        <span id="filepathText"></span>
      </div>
      <button id="copyTextBtn" title="Copy full path">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"
          />
        </svg>
      </button>
      <!-- Opens the raw metadata modal (delegated .metadata-link handler) -->
      <a
        id="metadataLink"
        href="#"
        target="_blank"
        rel="noopener noreferrer"
        class="metadata-link titlebar-icon-btn"
        title="View metadata (JSON)"
        aria-label="View metadata (JSON)"
        >{ }</a
      >
    </div>
    <!-- Scrollable Content Area -->
    <div class="filenameDescContainer">
      <!-- Cluster badge and image tags share one wrapping row -->
      <div class="drawer-label-row">
        <div id="clusterInfoContainer" style="display: none">
          <span id="clusterInfoBadge" class="cluster-info-badge" style="cursor: pointer"></span>
        </div>
        <div id="imageLabelContainer" class="image-label-row" style="display: none">
          Tags: <span id="imageLabelText"></span>
        </div>
      </div>
      <div class="metadata-fields-accordion">
        <button id="metadataFieldsHeader" class="accordion-header" type="button" aria-expanded="false">
          <span class="accordion-chevron">&#9654;</span>
          Image Details
        </button>
        <div id="metadataFieldsBody" class="accordion-body">
          <div id="descriptionText"></div>
        </div>
      </div>
    </div>
    <!-- Recall/Remix buttons (below scrollable area, always visible) -->
    <div id="recallButtonsContainer"></div>
  </div>
</div>
